apiVersion: v1
kind: Service
metadata:
  # Named `backend` — NOT `onecitizen-backend` — on purpose. The frontend image bakes in
  # infra/nginx/nginx.conf, which proxies to the host `backend`. Matching the compose
  # service name means one nginx config and one set of service URLs work in both
  # environments, so in-cluster routing cannot drift from local. Same for askgov-agent.
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onecitizen-backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # server.js closes the HTTP server and drains the pg pool on SIGTERM; this gives
      # in-flight requests (including long agent streams) time to finish.
      terminationGracePeriodSeconds: 45
      containers:
        - name: backend
          image: onecitizen/backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: onecitizen-config
          env:
            - name: PORT
              value: "4000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: onecitizen-secrets
                  key: JWT_SECRET
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: onecitizen-secrets
                  key: PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: onecitizen-secrets
                  key: PGPASSWORD
          # startupProbe covers first-boot migration + config seeding, which is slower
          # than steady state. Only once it passes do the other probes begin, so a slow
          # migration cannot get the pod killed mid-flight.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem means every writable path must be declared.
            - name: uploads
              mountPath: /var/lib/onecitizen
            - name: tmp
              mountPath: /tmp
      volumes:
        # emptyDir is correct for the postgres driver (uploads go to object storage or the
        # DB). Switch to a ReadWriteMany PVC if you run the json driver with >1 replica —
        # otherwise each pod sees a different store and reads become inconsistent.
        - name: uploads
          emptyDir: {}
        - name: tmp
          emptyDir: {}
