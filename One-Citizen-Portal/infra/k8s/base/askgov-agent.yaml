apiVersion: v1
kind: Service
metadata:
  # Name matches the compose service so AGENT_SERVICE_URL is identical in both.
  name: askgov-agent
  labels:
    app.kubernetes.io/name: askgov-agent
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: askgov-agent
  ports:
    - name: http
      port: 4100
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onecitizen-askgov-agent
  labels:
    app.kubernetes.io/name: askgov-agent
    app.kubernetes.io/component: agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: askgov-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: askgov-agent
        app.kubernetes.io/component: agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # An agent run streams SSE for as long as the LangGraph loop takes. Cutting a pod
      # off mid-run loses the citizen's answer, so allow generous drain time.
      terminationGracePeriodSeconds: 120
      containers:
        - name: askgov-agent
          image: onecitizen/askgov-agent
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4100
          envFrom:
            - configMapRef:
                name: onecitizen-config
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4100"
            # Same Secret key as the API — the agent verifies the citizen's portal token
            # with it, so the two MUST agree.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: onecitizen-secrets
                  key: JWT_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onecitizen-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: onecitizen-secrets
                  key: TAVILY_API_KEY
                  optional: true
          # Importing langgraph/langchain is slow; a startupProbe absorbs it so the
          # liveness probe never fires during a cold start.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Higher than the API: the LangChain/LangGraph import graph alone is heavy.
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # HF/transformers-style caches under $HOME are written on first use by some
            # langchain extras; give them a writable home rather than relaxing the
            # read-only root filesystem.
            - name: home
              mountPath: /home/appuser
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
