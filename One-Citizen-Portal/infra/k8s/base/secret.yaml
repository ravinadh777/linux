# TEMPLATE ONLY — placeholder values, safe to commit. Do NOT put real secrets here.
#
# This exists so `kubectl kustomize` renders and the Deployments' secretKeyRef targets
# resolve. Supply real values by one of:
#
#   1. Sealed Secrets / SOPS — commit an encrypted secret and drop this file from
#      the overlay's resources.
#   2. External Secrets Operator — an ExternalSecret syncs from Vault/AWS/GCP into a
#      Secret of this name.
#   3. Imperatively, for a throwaway cluster:
#        kubectl create secret generic onecitizen-secrets \
#          --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#          --from-literal=PGPASSWORD='...' \
#          --from-literal=OPENAI_API_KEY='...' \
#          --dry-run=client -o yaml | kubectl apply -f -
#
# JWT_SECRET is consumed by BOTH the API (signing) and the agent (verifying). One Secret
# feeds both so they cannot drift apart.
apiVersion: v1
kind: Secret
metadata:
  name: onecitizen-secrets
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  PGUSER: "onecitizen"
  PGPASSWORD: "onecitizendev"
  # Empty is valid: the agent falls back to its deterministic mode.
  OPENAI_API_KEY: ""
  TAVILY_API_KEY: ""
