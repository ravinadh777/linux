# Serves the built oneCitizen PWA and proxies the API. Baked into the frontend image
# (see frontend/Dockerfile) so compose and k8s route identically.
#
# `backend` resolves via the compose network / the k8s Service of the same name.

upstream onecitizen_api {
    server backend:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Requests can carry document uploads; keep this in step with backend MAX_UPLOAD_MB.
    client_max_body_size 25m;

    # ── Security headers ─────────────────────────────────────────────────────
    # No CSP here on purpose: it belongs with the app's own asset hashes, and a wrong
    # one silently breaks MUI/emotion's runtime-injected styles.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container healthcheck + k8s probes. Must not be logged or it drowns the access log.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── AskGov agent: Server-Sent Events ─────────────────────────────────────
    # MUST come before the generic /api block — nginx prefers the longest literal prefix,
    # but the ordering is made explicit here because getting it wrong breaks streaming in
    # a way that looks like the agent "hanging".
    #
    # Buffering off + HTTP/1.1 + no Connection header is what makes AG-UI events arrive
    # incrementally instead of in one lump at the end of the run.
    location /api/v1/agent/ {
        proxy_pass http://onecitizen_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        # An agent run with tool calls can legitimately stream for minutes.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        proxy_pass http://onecitizen_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout    60s;
        proxy_connect_timeout 5s;
    }

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin themselves to a stale bundle
    # after a deploy and keep requesting asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    # SPA history fallback — react-router owns client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
