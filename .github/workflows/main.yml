name: Azure Containerapp Bsol Datamigration-Backend Service CI/CD

on:
push:
branches:
- main
- develop

workflow_dispatch:

env:
RESOURCE_GROUP: loanhub-uat-resourcegroup
CONTAINER_APP_NAME: bosl-dm-uat-be
ACR_NAME: loanhubacruat
IMAGE_NAME: bosl-dm-uat-be

jobs:

build:
runs-on: ubuntu-latest

```
outputs:
  image: ${{ steps.image.outputs.image }}

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Azure Login
    uses: azure/login@v2
    with:
      creds: ${{ secrets.AZURE_CREDENTIALS }}

  - name: ACR Login
    run: az acr login --name $ACR_NAME

  - name: Build and Push Image
    id: image
    env:
      IMAGE_TAG: uat-${{ github.sha }}
    run: |
      IMAGE=$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG

      docker build -t $IMAGE .
      docker push $IMAGE

      echo "image=$IMAGE" >> $GITHUB_OUTPUT
```

deploy:
runs-on: ubuntu-latest
needs: build

```
steps:
  - name: Azure Login
    uses: azure/login@v2
    with:
      creds: ${{ secrets.AZURE_CREDENTIALS }}

  - name: Deploy Container App
    run: |
      az containerapp update \
        --name $CONTAINER_APP_NAME \
        --resource-group $RESOURCE_GROUP \
        --image ${{ needs.build.outputs.image }} \
        --set-env-vars \
          NODE_ENV=uat \
          SF_CLIENT_ID=${{ vars.SF_CLIENT_ID }} \
          SF_AUTH_URL=${{ vars.SF_AUTH_URL }} \
          SF_API_VERSION=${{ vars.SF_API_VERSION }}

  - name: Get Application URL
    run: |
      URL=$(az containerapp show \
        --name $CONTAINER_APP_NAME \
        --resource-group $RESOURCE_GROUP \
        --query properties.configuration.ingress.fqdn \
        -o tsv)

      echo "Application URL: https://$URL"
```
